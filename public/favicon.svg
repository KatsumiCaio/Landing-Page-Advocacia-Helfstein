<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6BE6A" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7730" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="16" fill="#050A14" stroke="#C5A059" stroke-width="4"/>
  <!-- Balance scale & Helfstein Monogram -->
  <g fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pillar -->
    <line x1="50" y1="20" x2="50" y2="78" />
    <!-- Top Beam -->
    <line x1="24" y1="34" x2="76" y2="34" />
    <circle cx="50" cy="22" r="3.5" fill="url(#gold)" />
    <!-- Left Scale -->
    <line x1="24" y1="34" x2="16" y2="52" />
    <line x1="24" y1="34" x2="32" y2="52" />
    <path d="M 14 52 Q 24 58 34 52 Z" fill="url(#gold)" fill-opacity="0.3" />
    <!-- Right Scale -->
    <line x1="76" y1="34" x2="68" y2="52" />
    <line x1="76" y1="34" x2="84" y2="52" />
    <path d="M 66 52 Q 76 58 86 52 Z" fill="url(#gold)" fill-opacity="0.3" />
    <!-- Base -->
    <line x1="36" y1="78" x2="64" y2="78" stroke-width="4.5" />
    <line x1="30" y1="83" x2="70" y2="83" stroke-width="3" />
  </g>
</svg>
